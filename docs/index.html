<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocab9000 for Android</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: "Segoe UI", "Hiragino Sans", "Noto Sans CJK JP", sans-serif; background: #eef2ff; color: #1e1b4b; line-height: 1.5; }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
    p { margin: 0.6rem 0; }
    a { color: #4f46e5; }
    .card { background: #fff; border-radius: 1rem; padding: 1.5rem 1.4rem; box-shadow: 0 8px 24px rgba(79, 70, 229, 0.08); }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Vocab9000</h1>
      <p>An Android flashcard app for the Longman Communication 9000 word list. Progress stays on your device. There is no account, and there are no ads.</p>
      <ul>
        <li><a href="privacy.html">Privacy policy</a> (the URL to paste into Play Console)</li>
        <li><a href="https://github.com/wjdartmouth/Vocab9000-Android">Source repository</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
